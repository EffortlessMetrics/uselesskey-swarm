created = "2026-08-04"
end_state = [
    "The no-panic checker reports no unreceipted new production debt.",
    "Each repaired production seam has focused regression proof and a bounded claim boundary.",
    "Historical baseline debt remains visible and is not silently absorbed into a reset.",
    "Remaining compatibility, release, and provider claims stay outside this lane unless separately specified.",
]
id = "no-panic-production-burndown"
objective = """
Burn down production-path panic-family debt in bounded, review-forward PRs
without resetting the baseline or weakening the no-new-debt policy. Each slice
must preserve the fixture library's deterministic, usable public behavior while
making failure behavior explicit at the narrowest responsible boundary.
"""
owner = "EffortlessMetrics"
schema_version = "1.0"
status = "archived"
title = "No-panic production debt burndown"

