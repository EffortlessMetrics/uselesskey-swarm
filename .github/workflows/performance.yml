name: Performance Evidence

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:
    inputs:
      compare:
        description: Compare latest measurements against docs/metadata/perf-baselines.json.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_HOME: /mnt/ci-scratch/cargo-home/${{ github.run_id }}-${{ github.run_attempt }}
  CARGO_CACHE_HOME: /mnt/ci-cache/cargo-home
  TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
  CARGO_TARGET_DIR: /mnt/ci-scratch/target/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  perf:
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    timeout-minutes: 90
    steps:
      - name: Disk guards
        shell: bash
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 20
          ci-disk-guard /mnt/ci-cache 10

      - name: Prepare scratch dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$TMPDIR" \
            "$CARGO_TARGET_DIR" \
            "$CARGO_HOME" \
            "$CARGO_CACHE_HOME/registry" \
            "$CARGO_CACHE_HOME/git"
          ln -s "$CARGO_CACHE_HOME/registry" "$CARGO_HOME/registry"
          ln -s "$CARGO_CACHE_HOME/git" "$CARGO_HOME/git"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"

      - name: Preflight performance toolchain
        shell: bash
        run: |
          set -euo pipefail
          df -h /mnt/ci-scratch /mnt/ci-cache
          rustc --version
          cargo --version
          nasm -v
          python3 --version

      - name: Run performance evidence
        shell: bash
        env:
          PERF_COMPARE: ${{ inputs.compare }}
        run: |
          set -euo pipefail
          compare="${PERF_COMPARE:-}"

          args=()
          if [[ -z "$compare" || "$compare" == "true" ]]; then
            args+=(--compare)
          fi

          cargo xtask perf "${args[@]}"

      - name: Write performance receipt summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out_dir = Path("target/xtask/perf")
          out_dir.mkdir(parents=True, exist_ok=True)
          latest_path = out_dir / "latest.json"
          markdown_path = out_dir / "latest.md"

          lines = ["# Performance Evidence", ""]

          if latest_path.exists():
              latest = json.loads(latest_path.read_text(encoding="utf-8"))
              scenarios = latest.get("scenarios") or []
              lines.append(f"- Schema version: `{latest.get('version', 'unknown')}`")
              lines.append(f"- Generated at unix: `{latest.get('generated_at_unix', 'unknown')}`")
              lines.append(f"- Scenarios: `{len(scenarios)}`")
              lines.append("")
              lines.append("| Scenario | Group | Iterations | Median ns | Mean ns | Output bytes |")
              lines.append("| --- | --- | ---: | ---: | ---: | ---: |")
              for scenario in scenarios:
                  lines.append(
                      "| `{id}` | `{group}` | {iterations} | {median_ns} | {mean_ns} | {output_bytes} |".format(
                          id=scenario.get("id", ""),
                          group=scenario.get("group", ""),
                          iterations=scenario.get("iterations", 0),
                          median_ns=scenario.get("median_ns", 0),
                          mean_ns=scenario.get("mean_ns", 0),
                          output_bytes=scenario.get("output_bytes", 0),
                      )
                  )
          else:
              lines.append("- Status: `missing latest.json`")
              lines.append("- The benchmark command failed before writing a report.")

          lines.append("")
          lines.append("## Claim Boundary")
          lines.append("")
          lines.append("- Performance evidence is host- and runner-sensitive.")
          lines.append("- It guards fixture-generation cost trends, not cryptographic correctness.")
          lines.append("- Baseline comparison only blocks entries with `enforce_in_ci = true`.")

          text = "\n".join(lines) + "\n"
          markdown_path.write_text(text, encoding="utf-8")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(text)
          else:
              print(text)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: performance-evidence
          path: target/xtask/perf
          if-no-files-found: warn

      - name: Cleanup performance scratch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_WORKSPACE}" in
            /mnt/actions/_work/*/*) ;;
            *)
              echo "refusing to clean unexpected workspace: ${GITHUB_WORKSPACE}" >&2
              exit 1
              ;;
          esac
          workspace_target="${GITHUB_WORKSPACE}/target"
          case "${workspace_target}" in
            /mnt/actions/_work/*/*/target) ;;
            *)
              echo "refusing to clean unexpected target: ${workspace_target}" >&2
              exit 1
              ;;
          esac
          for candidate in "$TMPDIR" "$CARGO_HOME" "$CARGO_TARGET_DIR"; do
            if [[ ! "${candidate}" =~ ^/mnt/ci-scratch/(tmp|cargo-home|target)/[0-9]+-[0-9]+$ ]]; then
              echo "refusing to clean unexpected scratch path: ${candidate}" >&2
              exit 1
            fi
          done
          rm -rf -- "$workspace_target" "$TMPDIR" "$CARGO_HOME" "$CARGO_TARGET_DIR"
          df -h /mnt/ci-scratch /mnt/ci-cache
